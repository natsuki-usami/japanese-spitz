<!doctype html>
<html lang="ja">
<meta charset="utf-8" />
<title>ヘッダー設定</title>
<style>
  body { width: 320px; font: 13px/1.5 sans-serif; padding: 12px; color: #222; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  fieldset { border: 1px solid #ccc; border-radius: 6px; margin: 12px 0; padding: 10px; }
  legend { font-weight: bold; }
  label { display: block; margin: 6px 0; }
  textarea { width: 100%; box-sizing: border-box; }
  #other { width: 60px; }
  button { cursor: pointer; padding: 6px 10px; }
  button:disabled { cursor: default; }
  p { margin: 6px 0; }
  .hint { color: #555; font-size: 12px; overflow-wrap: anywhere; }
  #reload { width: 100%; }
  #status { margin-top: 10px; white-space: pre-line; overflow-wrap: anywhere; }
  #status[data-error="true"] { color: #b00020; }
</style>
<h1>ヘッダー設定</h1>
<fieldset>
  <legend>対象サイト</legend>
  <button id="use-current-page" type="button" disabled>今開いているページを対象にする</button>
  <label for="domains">対象URL・ドメイン（1行に1つ）</label>
  <textarea id="domains" rows="3" placeholder="https://example.com/pro/&#10;example.com" spellcheck="false" disabled></textarea>
  <p class="hint">URLはドメイン部分を使用します。同じドメインと、そのサブドメインに適用します。</p>
</fieldset>
<fieldset>
  <legend>Proの表示設定</legend>
  <label><input type="checkbox" id="pro-enabled" disabled /> Pro表示をONにする</label>
  <p class="hint">ONのときに送信：<br><code>Nikkei-Flags: enableProRenewalProPage=true</code></p>
</fieldset>
<fieldset>
  <legend>Debug-Viewer-Country</legend>
  <label><input type="radio" name="mode" value="off" disabled /> OFF</label>
  <label><input type="radio" name="mode" value="JP" disabled /> JP</label>
  <label><input type="radio" name="mode" value="other" disabled /> JP以外：<input aria-label="JP以外の国コード" type="text" id="other" value="US" size="4" disabled /></label>
</fieldset>
<p class="hint">設定は自動保存されます。表示に反映するには、対象ページを再読み込みしてください。</p>
<button id="reload" type="button" disabled>保存して今のページを再読み込み</button>
<div id="status" role="status" aria-live="polite">設定を読み込み中…</div>
<script type="module" src="popup.js"></script>
</html>
